<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swan HILL" />
    <meta name="application-name" content="Swan HILL" />
    <meta name="theme-color" content="#020617" />
    <meta name="msapplication-TileColor" content="#020617" />

    <title>Swan HILL - ระบบจัดการรีสอร์ท</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root">
      <!-- Instant Branded Splash Screen on First Web Entry -->
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Prompt', sans-serif; color: #f8fafc; text-align: center; padding: 1.5rem; user-select: none;">
        <div style="position: relative; margin-bottom: 1.25rem;">
          <div style="width: 76px; height: 76px; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 35px rgba(16,185,129,0.25); border: 2px solid rgba(16,185,129,0.35); background: #0f172a; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
            <img src="/pwa-192x192.png" alt="Swan HILL" style="width: 100%; height: 100%; object-fit: cover;" />
          </div>
        </div>
        <img src="/swan-hill-white.png" alt="Swan HILL" style="height: 28px; object-fit: contain; margin-bottom: 0.35rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));" />
        <p style="font-size: 10px; font-weight: 700; color: #34d399; letter-spacing: 0.15em; text-transform: uppercase; margin: 0 0 1.5rem 0;">RESORT MANAGEMENT SYSTEM</p>
        <div style="width: 28px; height: 28px; border: 2.5px solid rgba(16,185,129,0.15); border-top-color: #10b981; border-radius: 50%; animation: swanHillSpin 0.8s linear infinite;"></div>
        <style>
          @keyframes swanHillSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
